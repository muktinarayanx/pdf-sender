<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cloud-based PDF sharing platform with secure upload and download">
  <title>PDF Sender — Cloud PDF Sharing</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h1>PDF Sender</h1>
      </div>
      <nav class="header-nav" id="headerNav" style="display: none;">
        <span class="user-badge" id="userBadge"></span>
        <button class="btn btn-ghost" id="logoutBtn">Logout</button>
      </nav>
    </header>

    <!-- Auth Section -->
    <section class="auth-section" id="authSection">
      <div class="auth-container">
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm">
          <h2>Welcome Back</h2>
          <p class="auth-subtitle">Sign in to access your PDFs</p>
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
          <div class="form-message" id="loginMessage"></div>
        </form>

        <!-- Register Form -->
        <form class="auth-form hidden" id="registerForm">
          <h2>Create Account</h2>
          <p class="auth-subtitle">Join to upload or download PDFs</p>
          <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label for="regRole">Role</label>
            <select id="regRole">
              <option value="user">Downloader (User)</option>
              <option value="uploader">Uploader (Admin)</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
          <div class="form-message" id="registerMessage"></div>
        </form>
      </div>
    </section>

    <!-- Dashboard Section -->
    <section class="dashboard-section hidden" id="dashboardSection">
      <!-- Upload Card (uploader only) -->
      <div class="card upload-card hidden" id="uploadCard">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="card-icon">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <h2>Upload PDF</h2>
        </div>
        <form id="uploadForm" class="upload-form">
          <div class="drop-zone" id="dropZone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="drop-icon">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <p>Drag & drop a PDF here, or <strong>click to browse</strong></p>
            <span class="drop-hint">Max file size: 10 MB</span>
            <input type="file" id="pdfInput" accept="application/pdf" hidden>
          </div>
          <div class="selected-file hidden" id="selectedFile">
            <span id="selectedFileName"></span>
            <button type="button" class="btn-remove" id="removeFile">&times;</button>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="uploadBtn" disabled>
            <span class="btn-text">Upload PDF</span>
            <span class="btn-loader hidden"></span>
          </button>
          <div class="form-message" id="uploadMessage"></div>
        </form>
      </div>

      <!-- Files List -->
      <div class="card files-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="card-icon">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <h2>Uploaded PDFs</h2>
          <button class="btn btn-ghost btn-sm" id="refreshBtn" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
        <div id="filesList" class="files-list">
          <div class="loading-placeholder">
            <div class="spinner"></div>
            <p>Loading files…</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
